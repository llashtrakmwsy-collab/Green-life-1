<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاشير ذكي متكامل</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --primary: #0f766e; --bg: #fdfdfd; --text: #111827; --border: #e5e7eb; }
        * { box-sizing: border-box; }
        body { font-family: system-ui; background: var(--bg); color: var(--text); padding-bottom: 80px; margin: 0; }
        .app { max-width: 600px; margin: auto; padding: 16px; }
        .card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid var(--border); border-radius: 8px; font: inherit; }
        button { background: var(--primary); color: white; font-weight: bold; cursor: pointer; border: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; border-top: 1px solid var(--border); z-index: 100; }
        .nav button { flex: 1; border-radius: 0; margin: 0; background: none; color: #6b7280; }
        .nav button.active { color: var(--primary); font-weight: bold; }
        .flex { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="app" id="app"></div>
    <div class="nav" id="nav"></div>
    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        let db, state = {
            view: 'pos', coName: 'المتجر الذكي', user: 'مدير',
            products: [], cart: [], customers: [], sales: [],
            currency: 'ج.م'
        };

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        } catch (e) {
            console.log("العمل محلياً بدون ربط سحابي");
        }

        function saveLocal() {
            localStorage.setItem('pos_data', JSON.stringify(state));
        }

        function loadLocal() {
            const saved = localStorage.getItem('pos_data');
            if (saved) state = JSON.parse(saved);
        }

        function render() {
            const app = document.getElementById('app');
            const nav = document.getElementById('nav');
            
            nav.innerHTML = `
                <button class="${state.view === 'pos' ? 'active' : ''}" onclick="setView('pos')">🧾 البيع</button>
                <button class="${state.view === 'products' ? 'active' : ''}" onclick="setView('products')">📦 الأصناف</button>
                <button class="${state.view === 'customers' ? 'active' : ''}" onclick="setView('customers')">👥 العملاء</button>
                <button class="${state.view === 'reports' ? 'active' : ''}" onclick="setView('reports')">📊 التقارير</button>
                <button class="${state.view === 'settings' ? 'active' : ''}" onclick="setView('settings')">⚙️ الإعدادات</button>
            `;

            let content = '';
            switch(state.view) {
                case 'pos':
                    content = `
                        <div class="card">
                            <h3>نقطة البيع</h3>
                            <input type="text" id="prodSearch" placeholder="ابحث بالاسم أو الباركود..." oninput="searchProd(this.value)">
                            <div id="searchResults"></div>
                        </div>
                        <div class="card">
                            <h3>السلة</h3>
                            <div id="cartList">${state.cart.map((item, index) => `
                                <div class="flex">
                                    <span>${item.name} (${item.price} ${state.currency}) x ${item.qty}</span>
                                    <button style="width: auto; padding: 4px 8px;" onclick="removeFromCart(${index})">حذف</button>
                                </div>
                            `).join('') || 'السلة فارغة'}</div>
                            <h4>الإجمالي: ${state.cart.reduce((sum, i) => sum + (i.price * i.qty), 0)} ${state.currency}</h4>
                            <button onclick="checkout()">إتمام البيع</button>
                        </div>
                        <div class="card">
                            <h3>بيانات العميل</h3>
                            <input type="text" id="custPhone" placeholder="رقم الهاتف..." oninput="findCustomer(this.value)">
                            <input type="text" id="custName" placeholder="اسم العميل...">
                        </div>
                    `;
                    break;
                case 'products':
                    content = `
                        <div class="card">
                            <h3>إضافة صنف جديد</h3>
                            <input type="text" id="pName" placeholder="اسم الصنف">
                            <div class="grid">
                                <input type="number" id="pPrice" placeholder="سعر البيع">
                                <input type="number" id="pCost" placeholder="سعر التكلفة">
                            </div>
                            <input type="number" id="pQty" placeholder="الكمية المتاحة">
                            <input type="text" id="pBarcode" placeholder="الباركود (اختياري)">
                            <button onclick="addProduct()">حفظ الصنف</button>
                        </div>
                        <div class="card">
                            <h3>قائمة الأصناف</h3>
                            <div>${state.products.map(p => `
                                <div class="flex" style="border-bottom: 1px solid #eee; padding: 8px 0;">
                                    <span>${p.name} - ${p.price} ${state.currency} (الكمية: ${p.qty})</span>
                                </div>
                            `).join('')}</div>
                        </div>
                    `;
                    break;
                case 'customers':
                    content = `
                        <div class="card">
                            <h3>سجل العملاء</h3>
                            <div>${state.customers.map(c => `
                                <div class="flex" style="border-bottom: 1px solid #eee; padding: 8px 0;">
                                    <span>${c.name} - ${c.phone} (الرصيد: ${c.balance || 0} ${state.currency})</span>
                                </div>
                            `).join('')}</div>
                        </div>
                    `;
                    break;
                case 'reports':
                    const totalSales = state.sales.reduce((sum, s) => sum + s.total, 0);
                    const totalCost = state.sales.reduce((sum, s) => sum + s.items.reduce((c, i) => c + (i.cost * i.qty), 0), 0);
                    content = `
                        <div class="card">
                            <h3>التقارير المالية</h3>
                            <p>إجمالي المبيعات: ${totalSales} ${state.currency}</p>
                            <p>إجمالي الأرباح التقديرية: ${totalSales - totalCost} ${state.currency}</p>
                            <p>عدد الفواتير: ${state.sales.length}</p>
                        </div>
                    `;
                    break;
                case 'settings':
                    content = `
                        <div class="card">
                            <h3>إعدادات النظام</h3>
                            <label>اسم النشاط</label>
                            <input type="text" id="coNameInput" value="${state.coName}">
                            <label>العملة</label>
                            <input type="text" id="currencyInput" value="${state.currency}">
                            <button onclick="saveSettings()">حفظ الإعدادات</button>
                        </div>
                    `;
                    break;
            }
            app.innerHTML = content;
        }

        function setView(view) {
            state.view = view;
            render();
        }

        function addProduct() {
            const name = document.getElementById('pName').value;
            const price = parseFloat(document.getElementById('pPrice').value);
            const cost = parseFloat(document.getElementById('pCost').value) || 0;
            const qty = parseInt(document.getElementById('pQty').value) || 0;
            const barcode = document.getElementById('pBarcode').value;

            if(!name || isNaN(price)) return alert("يرجى إدخال البيانات الأساسية");
            
            state.products.push({name, price, cost, qty, barcode});
            saveLocal();
            alert("تم حفظ الصنف");
            setView('products');
        }

        function searchProd(query) {
            const resDiv = document.getElementById('searchResults');
            if(!query) { resDiv.innerHTML = ''; return; }
            const matches = state.products.filter(p => p.name.includes(query) || p.barcode === query);
            resDiv.innerHTML = matches.map(p => `
                <div style="padding: 8px; background: #f9f9f9; margin-top: 4px; border-radius: 4px; cursor:pointer;" onclick="addToCart(${state.products.indexOf(p)})">
                    ${p.name} - ${p.price} ${state.currency}
                </div>
            `).join('');
        }

        function addToCart(index) {
            const prod = state.products[index];
            if(prod.qty <= 0) return alert("الكمية غير متاحة");
            const existing = state.cart.find(item => item.name === prod.name);
            if(existing) {
                existing.qty++;
            } else {
                state.cart.push({...prod, qty: 1});
            }
            prod.qty--;
            render();
        }

        function removeFromCart(index) {
            const item = state.cart[index];
            const prod = state.products.find(p => p.name === item.name);
            if(prod) prod.qty += item.qty;
            state.cart.splice(index, 1);
            render();
        }

        function findCustomer(phone) {
            const cust = state.customers.find(c => c.phone === phone);
            if(cust) {
                document.getElementById('custName').value = cust.name;
            }
        }

        function checkout() {
            if(state.cart.length === 0) return alert("السلة فارغة");
            const phone = document.getElementById('custPhone').value;
            const name = document.getElementById('custName').value || "عميل نقدي";
            
            if(phone) {
                let cust = state.customers.find(c => c.phone === phone);
                if(!cust) {
                    cust = {name, phone, balance: 0};
                    state.customers.push(cust);
                }
            }

            const total = state.cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            state.sales.push({
                items: [...state.cart],
                total: total,
                date: new Date().toISOString(),
                cashier: state.user
            });

            state.cart = [];
            saveLocal();
            alert("تمت عملية البيع بنجاح");
            render();
        }

        function saveSettings() {
            state.coName = document.getElementById('coNameInput').value;
            state.currency = document.getElementById('currencyInput').value;
            saveLocal();
            alert("تم حفظ الإعدادات");
        }

        loadLocal();
        render();
    </script>
</body>
</html>
