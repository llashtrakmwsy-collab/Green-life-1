<style>
/* متغيرات الألوان والثيم الفاتح والداكن */

:root[data-theme="dark"] {

  --panel: #18251D;
  --ink: #E6EFE8;
  --mute: #9CB0A2;
  --line: #2B3C31;

  --acc-ink: #0C1A11;
  --warn: #F0A63A;
  --bad: #FF8A80;
  --soft: #1F3026;

  box-sizing: border-box;

body {

<body>
<main>
  <h1>طبيب النبات</h1>
  <p class="sub">صوّر الورقة أو الثمرة المصابة واوصف المشكلة، وتحصل على التشخيص المحتمل وخطوات العلاج.</p>

  <div class="card">
    <label for="file">صور النبات (حتى 3 صور)</label>
    <label class="drop" for="file">
      <strong>التقط صورة أو اختر من المعرض</strong>
      <span>صوّر الجزء المصاب من قرب، وصورة للنبات كاملًا إن أمكن</span>
      <input id="file" type="file" accept="image/*" multiple>
    </label>
    <div class="thumbs" id="thumbs"></div>

    <label for="plant">نوع النبات (إن عرفته)</label>
    <input id="plant" type="text" placeholder="مثال: طماطم، ورد جوري، نخيل">

    <label for="desc">وصف المشكلة</label>
    <textarea id="desc" placeholder="مثال: بقع بنية على الأوراق السفلية بدأت من أسبوع، والأوراق بتصفر وتقع"></textarea>

    <button class="btn" id="go">شخّص المشكلة</button>
    <div class="msg" id="msg"></div>
  </div>

  <div id="result"></div>
</main>

<script>
// أداة مختصرة لاختيار العناصر
const $ = s => document.querySelector(s);
let blobs = [];

// دالة ضغط وتصغير الصور قبل الإرسال لتسريع التحليل وتقليل استهلاك البيانات
async function shrink(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  await new Promise((r, j) => {
    img.onload = r;
    img.onerror = j;
    img.src = url;
  });
  const k = Math.min(1, 1024 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k);
  c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
}

// عرض الصور المصغرة المرفوعة مع إمكانية حذف أي صورة
function thumbs() {
  const t = $('#thumbs');
  t.innerHTML = '';
  blobs.forEach((b, i) => {
    const d = document.createElement('div');
    const im = document.createElement('img');
    const x = document.createElement('button');
    im.src = URL.createObjectURL(b);
    im.alt = 'صورة ' + (i + 1);
    x.textContent = '×';
    x.setAttribute('aria-label', 'حذف الصورة');
    x.onclick = () => {
      blobs.splice(i, 1);
      thumbs();
    };
    d.append(im, x);
    t.appendChild(d);
  });
}

// الاستماع لاختيار الصور
$('#file').onchange = async e => {
  for (const f of [...e.target.files]) {
    if (blobs.length >= 3) break;
    try {
      blobs.push(await shrink(f));
    } catch (_) {}
  }
  e.target.value = '';
  thumbs();
};

// دوال مساعدة لإنشاء عناصر HTML نظيفة
function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
}

function list(title, arr) {
  if (!arr || !arr.length) return null;
  const w = document.createElement('div');
  w.appendChild(el('h3', 0, title));
  const u = el('ul');
  arr.forEach(x => u.appendChild(el('li', 0, x)));
  w.appendChild(u);
  return w;
}

// عرض نتيجة التشخيص المنظمة داخل البطاقة
function render(r) {
  const box = $('#result');
  box.innerHTML = '';
  const card = el('div', 'card');

  if (r.plant_name) {
    card.appendChild(el('p', 'sub', 'النبات: ' + r.plant_name));
  }

  if (r.needs_more_info && r.questions && r.questions.length) {
    card.appendChild(el('p', 'q', 'الصورة والوصف لا يكفيان لتشخيص مؤكد. أجب عن هذه الأسئلة وأعد المحاولة:'));
    const u = el('ul');
    r.questions.forEach(q => u.appendChild(el('li', 0, q)));
    card.appendChild(u);
  }

  (r.diagnoses || []).forEach((d, i) => {
    const s = el('div', i ? 'alt' : '');
    s.appendChild(el('h2', 0, (i ? 'احتمال آخر: ' : 'التشخيص الأرجح: ') + d.name));

    const tags = el('div');
    if (d.confidence) {
      tags.appendChild(el('span', 'tag' + (d.confidence === 'عالية' ? ' hi' : ''), 'درجة الثقة: ' + d.confidence));
    }
    if (i === 0 && r.urgency) {
      tags.appendChild(el('span', 'tag urg', 'الاستعجال: ' + r.urgency));
    }
    s.appendChild(tags);

    if (d.signs) s.appendChild(el('p', 0, d.signs));
    if (d.cause) s.appendChild(el('p', 0, 'السبب: ' + d.cause));

    [
      list('الإسعاف الفوري', i ? null : r.immediate_steps),
      list('العلاج العضوي والمنزلي', d.treatment_organic),
      list('العلاج الكيميائي', d.treatment_chemical),
      list('الوقاية', d.prevention)
    ].forEach(x => x && s.appendChild(x));

    card.appendChild(s);
  });

  if (r.when_to_ask_expert) {
    card.appendChild(el('div', 'warn', 'متى تسأل مهندسًا زراعيًا: ' + r.when_to_ask_expert));
  }

  card.appendChild(el('div', 'warn', 'هذا تشخيص مبدئي بالذكاء الاصطناعي وقد يخطئ. عند استخدام أي مبيد اقرأ الملصق، والبس قفازات وكمامة، وجرّبه على ورقة واحدة أولًا.'));

  box.appendChild(card);
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// تحويل الملف إلى Base64 لإرساله إلى Gemini API
const b64 = b => new Promise(r => {
  const f = new FileReader();
  f.onload = () => r(f.result.split(',')[1]);
  f.readAsDataURL(b);
});

// دالة الإرسال مع إعادة المحاولة التلقائية عند الضغط (Exponential Backoff)
async function fetchWithRetry(url, options, maxRetries = 4) {
  let delay = 1000;
  for (let i = 0; i <= maxRetries; i++) {
    const res = await fetch(url, options);
    if (res.ok) return res;
    if ((res.status === 429 || res.status >= 500) && i < maxRetries) {
      await new Promise(resolve => setTimeout(resolve, delay));
      delay *= 2;
      continue;
    }
    const err = new Error('http');
    err.status = res.status;
    throw err;
  }
}

// زر تشخيص المشكلة
$('#go').onclick = async () => {
  const m = $('#msg');
  const plant = $('#plant').value.trim();
  const desc = $('#desc').value.trim();
  const apiKey = ""; // يتم تزويده تلقائياً في بيئة التشغيل
  const model = "gemini-3-flash-preview";

  m.className = 'msg';

  if (!blobs.length && !desc) {
    m.className = 'msg err';
    m.textContent = 'أضف صورة أو اكتب وصفًا للمشكلة.';
    return;
  }

  $('#go').disabled = true;
  m.innerHTML = '<span class="spin"></span>جارٍ فحص النبات…';

  try {
    const prompt = 'أنت مهندس زراعي خبير في أمراض النبات والآفات ونقص العناصر. حلّل حالة النبات' +
      (blobs.length ? ' من الصور المرفقة' : '') +
      ' ومن المعلومات التالية.\nنوع النبات: ' + (plant || 'غير معروف') +
      '\nوصف المستخدم: ' + (desc || 'لا يوجد') + '\n' +
      'اكتب بالعربية المبسطة. رتّب حتى 3 تشخيصات محتملة من الأرجح. لا تجزم عند الشك. في العلاج الكيميائي اذكر المادة الفعالة أو الفئة لا العلامات التجارية، وذكّر بقراءة الملصق. إن كانت المعلومات غير كافية اجعل needs_more_info true واكتب أسئلة محددة. أعد JSON فقط بهذا الشكل: {"plant_name":"","urgency":"منخفض|متوسط|عالٍ","needs_more_info":false,"questions":[],"immediate_steps":[],"diagnoses":[{"name":"","confidence":"عالية|متوسطة|منخفضة","signs":"","cause":"","treatment_organic":[],"treatment_chemical":[],"prevention":[]}],"when_to_ask_expert":""}';

    const parts = [{ text: prompt }];
    for (const b of blobs) {
      parts.push({
        inlineData: {
          mimeType: 'image/jpeg',
          data: await b64(b)
        }
      });
    }

    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
    const payload = {
      contents: [{ parts }],
      generationConfig: {
        responseMimeType: 'application/json'
      }
    };

    const r = await fetchWithRetry(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const j = await r.json();
    const t = (j.candidates && j.candidates[0] && j.candidates[0].content.parts.map(p => p.text).join('')) || '';
    const parsed = JSON.parse(t.replace(/```json|```/g, '').trim());

    render(parsed);
    m.textContent = '';
  } catch (e) {
    m.className = 'msg err';
    if (e.status === 429) {
      m.textContent = 'وصلت للحد المسموح حاليًا. انتظر دقيقة ثم أعد المحاولة.';
    } else {
      m.textContent = 'تعذّر التشخيص. تأكد من الإنترنت وجرّب مرة أخرى.';
    }
  } finally {
    $('#go').disabled = false;
  }
};
</script>
</body>
</html>
