<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كاشير ذكي</title><meta name="theme-color" content="#0d9488"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="كاشير ذكي">
<style>
:root{--bg:#f3f5f7;--cd:#fff;--tx:#17202a;--mu:#6b7684;--pr:#0d9488;--pt:#fff;--bd:#e2e6ea;--rd:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101315;--cd:#1a1e21;--tx:#eef1f3;--mu:#98a2ad;--bd:#2b3136;--pr:#2dd4bf;--pt:#06201d;--rd:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.w{max-width:680px;margin:auto;padding:12px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
input,select,textarea{width:100%;padding:12px;margin:4px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button,.btn{display:inline-block;text-align:center;padding:12px 14px;border:0;border-radius:10px;background:var(--pr);color:var(--pt);font:inherit;font-weight:700;cursor:pointer}
button.g,.btn.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}button.d{background:var(--rd);color:#fff}button.big{width:100%;margin:6px 0;padding:15px}
.r{display:flex;gap:8px;align-items:center}.r>input,.r>select{flex:1}.r>button{flex:0 0 auto}
.nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto}
.nav button{flex:1 0 auto;background:none;color:var(--mu);font-size:12px;padding:6px 10px}.nav button.on{color:var(--pr)}.nav b{display:block;font-size:20px}
.mu{color:var(--mu);font-size:14px}.t{font-size:22px;font-weight:800}
.ai{background:color-mix(in srgb,var(--pr) 14%,transparent);border-radius:10px;padding:10px;margin:8px 0;font-size:15px;white-space:pre-wrap}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);gap:8px}
.ov{position:fixed;inset:0;background:#0009;z-index:9;display:flex;align-items:flex-end;justify-content:center}
.mc{background:var(--cd);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#rd{width:100%;min-height:200px;border-radius:10px;overflow:hidden;margin:8px 0;background:#000}
pre{white-space:pre-wrap;font:inherit;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media print{body>*:not(#md){display:none}.ov{position:static;background:none}.mc button,.mc .grid{display:none}}
</style></head><body><div class="w" id="app"></div><div id="md"></div>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ROLES={owner:"صاحب الشركة",manager:"مدير",cashier:"كاشير"};
let S=null,me=null,tab="pos",cart=[],disc=0,cust={name:"",phone:""},pm="نقدي",found=null,scanner=null;
try{S=JSON.parse(localStorage.getItem("pos2")||"null")}catch(e){}
const save=()=>{try{localStorage.setItem("pos2",JSON.stringify(S))}catch(e){}};
const fmt=n=>(+n||0).toFixed(2)+" "+S.cur;
async function hash(p){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("pos:"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return btoa(unescape(encodeURIComponent(p)))}}
function modal(h){$("#md").innerHTML=h?`<div class="ov"><div class="mc">${h}</div></div>`:""}
async function ask(p){try{const s=await claude.use("sample");if(!s)return null;return (await s(p,{modelTier:"quick"})).text}catch(e){return null}}
/* ---------- shell ---------- */
function render(){
 const a=$("#app");
 if(!S){a.innerHTML=`<div class="c"><div class="t">🛒 إنشاء الشركة</div><p class="mu">أول حساب هو صاحب الشركة.</p><input id="co" placeholder="اسم الشركة"><input id="cu" placeholder="العملة (مثال: ج.م)" value="ج.م"><input id="u" placeholder="اسم المستخدم"><input id="ph" inputmode="tel" value="01102200175" placeholder="رقم واتساب صاحب الشركة"><input id="p" type="password" placeholder="كلمة السر (4 أحرف+)"><button class="big" onclick="setup()">إنشاء</button></div>`;$(".nav")?.remove();return}
 if(!me){a.innerHTML=`<div class="c"><div class="t">${esc(S.co)}</div><p class="mu">تسجيل الدخول</p><input id="u" placeholder="اسم المستخدم"><input id="p" type="password" placeholder="كلمة السر" onkeydown="if(event.key==='Enter')login()"><button class="big" onclick="login()">دخول</button><button class="g big" onclick="forgot()">نسيت كلمة السر؟</button><p id="er" class="mu"></p></div>`;$(".nav")?.remove();return}
 const m=me.role!=="cashier",o=me.role==="owner";
 const T=[["pos","🧾","بيع"],m&&["prod","📦","الأصناف"],m&&["cust","👥","العملاء"],m&&["rep","📊","التقارير"],m&&["ai","✨","الذكاء"],o&&["set","⚙️","الإعدادات"]].filter(Boolean);
 a.innerHTML=`<div class="r" style="margin-bottom:10px;justify-content:space-between"><div><b>${esc(S.co)}</b><div class="mu">${esc(me.name)} · ${ROLES[me.role]}</div></div><button class="g" onclick="me=null;cart=[];render()">خروج</button></div><div id="v"></div>`;
 $(".nav")?.remove();document.body.insertAdjacentHTML("beforeend",`<div class="nav">${T.map(([k,i,l])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';render()"><b>${i}</b>${l}</button>`).join("")}</div>`);
 ({pos:vPos,prod:vProd,cust:vCust,rep:vRep,ai:vAi,set:vSet})[tab]();}
async function setup(){const co=$("#co").value.trim(),u=$("#u").value.trim(),p=$("#p").value,ph0=$("#ph").value.replace(/\D/g,""),code=genCode();if(!co||!u||p.length<4||ph0.length<8)return alert("أكمل الحقول مع رقم الواتساب");
 S={co,cur:$("#cu").value.trim()||"",tax:0,cc:"20",users:[{name:u,pass:await hash(p),role:"owner",phone:ph0}],rc:await hash(code),cats:["عام"],prods:[],custs:[],sales:[]};save();render();showRc(code,ph0)}
async function login(){const u=$("#u").value.trim(),h=await hash($("#p").value);const x=S.users.find(x=>x.name===u&&x.pass===h);if(!x){$("#er").textContent="بيانات غير صحيحة";return}me=x;tab="pos";render()}
/* ---------- scanner ---------- */
async function scan(cb){
 modal(`<b>وجّه الكاميرا نحو الباركود</b><div id="rd"></div><p class="mu" id="se"></p><label class="btn g" style="display:block;margin-bottom:8px">📷 التقاط صورة للباركود<input type="file" accept="image/*" capture="environment" hidden id="sf"></label><button class="g big" onclick="endScan()">إغلاق</button>`);
 $("#sf").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const s=scanner||new Html5Qrcode("rd");const r=await s.scanFile(f,false);endScan();cb(r)}catch(x){$("#se").textContent="لم أتعرف على الباركود، جرّب صورة أوضح."}};
 try{scanner=new Html5Qrcode("rd");await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:150}},t=>{endScan();cb(t)},()=>{})}
 catch(e){$("#se").textContent="الكاميرا غير متاحة داخل هذه النافذة. افتح الرابط في المتصفح مباشرة، أو استخدم زر التقاط صورة."}}
async function endScan(){try{if(scanner){await scanner.stop();scanner.clear()}}catch(e){}scanner=null;modal("")}
/* ---------- cashier ---------- */
function vPos(){$("#v").innerHTML=`<div class="c"><div class="r"><input id="bc" placeholder="باركود / اسم الصنف (أو جهاز قارئ)" onkeydown="if(event.key==='Enter')look(this.value)"><button onclick="look($('#bc').value)">بحث</button></div><button class="big" onclick="scan(look)">📷 مسح بالكاميرا</button><div id="fd"></div></div>
<div class="c"><b>السلة</b><div id="ct"></div></div>
<div class="c"><b>العميل</b><input id="cp" inputmode="tel" placeholder="رقم الهاتف" value="${esc(cust.phone)}" oninput="cust.phone=this.value;autoC()"><input id="cn" placeholder="اسم العميل" value="${esc(cust.name)}" oninput="cust.name=this.value"></div>
<div class="c"><div class="grid"><input id="ds" type="number" min="0" placeholder="خصم" value="${disc||""}" oninput="disc=+this.value||0;totals()"><select onchange="pm=this.value">${["نقدي","بطاقة","تحويل"].map(x=>`<option ${x===pm?"selected":""}>${x}</option>`).join("")}</select></div><div id="tt"></div></div>`;showF();showC()}
function autoC(){const p=cust.phone.replace(/\D/g,"");const c=S.custs.find(x=>x.phone===p);if(c&&p.length>5){cust.name=c.name;$("#cn").value=c.name}}
function look(q){q=String(q||"").trim();if(!q)return;const p=S.prods.find(x=>x.bc===q)||S.prods.find(x=>x.name.includes(q));found=p||{none:q};showF();if(p)explain(p);$("#bc")&&($("#bc").value="")}
function showF(){const f=$("#fd");if(!f)return;if(!found){f.innerHTML="";return}
 if(found.none){f.innerHTML=`<p class="mu">لا يوجد صنف: ${esc(found.none)}</p>${me.role!=="cashier"?`<button class="g" onclick="editProd(-1,'${esc(found.none)}')">➕ إضافة صنف بهذا الباركود</button>`:""}`;return}
 f.innerHTML=`<div class="row"><div><b>${esc(found.name)}</b><div class="mu">${esc(found.cat)} · متاح ${found.qty}</div></div><b>${fmt(found.price)}</b></div><div class="ai" id="ai">${found.desc?"✨ "+esc(found.desc):"⏳ الذكاء الاصطناعي يشرح الصنف…"}</div><button class="big" onclick="add(S.prods.indexOf(found))">➕ أضف إلى السلة</button>`}
async function explain(p){if(p.desc)return;const t=await ask(`اشرح بالعربية البسيطة في جملتين فقط: ما استخدام هذا المنتج ولمن يناسب وأي تنبيه مهم؟ المنتج: ${p.name} (التصنيف: ${p.cat}). بدون مقدمات.`);if(t){p.desc=t.trim();save()}else if(found===p){$("#ai").textContent="تعذّر الشرح الآن.";return}if(found===p)showF()}
function add(i){const p=S.prods[i];if(!p)return;const x=cart.find(c=>c.i===i);const q=x?x.q:0;if(q>=p.qty)return alert("نفد المخزون");x?x.q++:cart.push({i,q:1});showC()}
function qty(i,d){const x=cart.find(c=>c.i===i);x.q=Math.min(x.q+d,S.prods[i].qty);if(x.q<=0)cart=cart.filter(c=>c!==x);showC()}
function calc(){const sub=cart.reduce((a,c)=>a+S.prods[c.i].price*c.q,0),d=Math.min(disc,sub),tax=(sub-d)*S.tax/100;return{sub,d,tax,tot:sub-d+tax}}
function showC(){const c=$("#ct");if(!c)return;c.innerHTML=cart.map(x=>{const p=S.prods[x.i];return`<div class="row"><span style="flex:1">${esc(p.name)}<div class="mu">${fmt(p.price)}</div></span><span class="r"><button class="g" onclick="qty(${x.i},-1)">−</button><b>${x.q}</b><button class="g" onclick="qty(${x.i},1)">+</button></span></div>`}).join("")||`<p class="mu">السلة فارغة</p>`;totals()}
function totals(){const t=$("#tt");if(!t)return;const k=calc();t.innerHTML=cart.length?`<div class="row"><span>المجموع</span><span>${fmt(k.sub)}</span></div>${S.tax?`<div class="row"><span>ضريبة ${S.tax}%</span><span>${fmt(k.tax)}</span></div>`:""}<div class="row t"><span>الإجمالي</span><span>${fmt(k.tot)}</span></div><button class="big" onclick="checkout()">✅ إتمام البيع</button>`:""}
function checkout(){const k=calc(),items=cart.map(x=>{const p=S.prods[x.i];p.qty-=x.q;return{n:p.name,q:x.q,pr:p.price}});const ph=cust.phone.replace(/\D/g,"");
 if(ph){const c=S.custs.find(x=>x.phone===ph);c?(c.name=cust.name||c.name):S.custs.push({phone:ph,name:cust.name})}
 const s={id:S.sales.length+1,t:Date.now(),by:me.name,cust:{name:cust.name,phone:ph},items,sub:k.sub,disc:k.d,tax:k.tax,tot:k.tot,pay:pm};S.sales.push(s);save();cart=[];found=null;disc=0;cust={name:"",phone:""};render();showInv(s.id)}
/* ---------- invoice ---------- */
const sale=id=>S.sales.find(s=>s.id===id);
function invTxt(s){return `*${S.co}*\nفاتورة رقم ${s.id}\n${new Date(s.t).toLocaleString("ar-EG")}\n${s.cust.name?"العميل: "+s.cust.name+"\n":""}----------\n`+s.items.map(i=>`${i.n} × ${i.q} = ${fmt(i.pr*i.q)}`).join("\n")+`\n----------\nالمجموع: ${fmt(s.sub)}\n`+(s.disc?`الخصم: ${fmt(s.disc)}\n`:"")+(s.tax?`الضريبة: ${fmt(s.tax)}\n`:"")+`*الإجمالي: ${fmt(s.tot)}*\nالدفع: ${s.pay}\nشكرا لتعاملكم معنا 🙏`}
function showInv(id){const s=sale(id);modal(`<div class="t">فاتورة #${s.id}</div><div class="c"><pre>${esc(invTxt(s).replace(/\*/g,""))}</pre></div><div class="grid"><button onclick="sendWa(${id})">واتساب</button><button onclick="sendSms(${id})">رسالة SMS</button><button class="g" onclick="shareInv(${id})">مشاركة</button><button class="g" onclick="navigator.clipboard.writeText(invTxt(sale(${id}))).then(()=>alert('تم النسخ'),()=>alert('تعذّر النسخ'))">نسخ</button><button class="g" onclick="window.print()">طباعة</button><button class="g" onclick="modal('')">إغلاق</button></div>`)}
function ph(s){let p=s.cust.phone;if(p.startsWith("0"))p=S.cc+p.slice(1);return p}
function sendWa(id){const s=sale(id);window.open(`https://wa.me/${s.cust.phone?ph(s):""}?text=${encodeURIComponent(invTxt(s))}`,"_blank")}
function sendSms(id){const s=sale(id);location.href=`sms:${s.cust.phone}?body=${encodeURIComponent(invTxt(s).replace(/\*/g,""))}`}
async function shareInv(id){try{await navigator.share({text:invTxt(sale(id)).replace(/\*/g,"")})}catch(e){}}
/* ---------- products ---------- */
function vProd(){$("#v").innerHTML=`<div class="r"><input id="q" placeholder="بحث" oninput="listP()"><button onclick="editProd(-1)">➕ صنف</button></div><div class="c" id="pl"></div>`;listP()}
function listP(){const q=($("#q")?.value||"").trim();$("#pl").innerHTML=S.prods.map((p,i)=>[p,i]).filter(([p])=>!q||p.name.includes(q)||p.bc.includes(q)).map(([p,i])=>`<div class="row" onclick="editProd(${i})"><div><b>${esc(p.name)}</b><div class="mu">${esc(p.cat)} · ${esc(p.bc)} · كمية ${p.qty}${p.qty<=3?" ⚠️":""}</div></div><b>${fmt(p.price)}</b></div>`).join("")||'<p class="mu">لا أصناف</p>'}
function editProd(i,bc){const p=S.prods[i]||{bc:bc||"",name:"",price:"",qty:"",cat:S.cats[0],desc:""};
 modal(`<b>${i<0?"صنف جديد":"تعديل صنف"}</b><div class="r"><input id="pb" placeholder="الباركود" value="${esc(p.bc)}"><button class="g" onclick="scan(t=>$('#pb').value=t)">📷</button></div><input id="pn" placeholder="الاسم" value="${esc(p.name)}"><div class="grid"><input id="pp" type="number" placeholder="السعر" value="${p.price}"><input id="pq" type="number" placeholder="الكمية" value="${p.qty}"></div>
 <div class="r"><select id="pc">${S.cats.map(c=>`<option ${c===p.cat?"selected":""}>${esc(c)}</option>`).join("")}</select><button class="g" onclick="newCat()">+ تصنيف</button></div><textarea id="pd" rows="3" placeholder="الوصف (يُولَّد بالذكاء الاصطناعي)">${esc(p.desc)}</textarea><button class="g big" onclick="genDesc()">✨ وصف ذكي</button>
 <div class="grid"><button onclick="saveProd(${i})">حفظ</button><button class="g" onclick="modal('')">إلغاء</button></div>${i>=0?`<button class="d big" onclick="delProd(${i})">حذف الصنف</button>`:""}`)}
async function genDesc(){const n=$("#pn").value.trim();if(!n)return alert("اكتب الاسم أولا");$("#pd").value="⏳…";const t=await ask(`اكتب بالعربية جملتين: استخدام المنتج "${n}" ولمن يناسب. بدون مقدمات.`);$("#pd").value=t?t.trim():""}
function newCat(){const c=prompt("اسم التصنيف الجديد");if(c&&c.trim()&&!S.cats.includes(c.trim())){S.cats.push(c.trim());save();const o=document.createElement("option");o.textContent=c.trim();$("#pc").append(o);$("#pc").value=c.trim()}}
function saveProd(i){const bc=$("#pb").value.trim(),name=$("#pn").value.trim(),price=+$("#pp").value;if(!bc||!name||!(price>=0)||$("#pp").value==="")return alert("الباركود والاسم والسعر مطلوبة");if(S.prods.some((x,j)=>x.bc===bc&&j!==i))return alert("الباركود مستخدم");
 const p={bc,name,price,qty:+$("#pq").value||0,cat:$("#pc").value,desc:$("#pd").value.trim()};i<0?S.prods.push(p):S.prods[i]=p;save();modal("");found=null;render()}
function delProd(i){if(confirm("حذف الصنف؟")){S.prods.splice(i,1);cart=[];save();modal("");render()}}
/* ---------- customers ---------- */
function vCust(){$("#v").innerHTML=`<div class="c">${S.custs.map((c,i)=>{const n=S.sales.filter(s=>s.cust.phone===c.phone),t=n.reduce((a,s)=>a+s.tot,0);return`<div class="row"><div><b>${esc(c.name||"بدون اسم")}</b><div class="mu">${esc(c.phone)} · ${n.length} فاتورة · ${fmt(t)}</div></div><span class="r"><button onclick="window.open('https://wa.me/${c.phone.startsWith("0")?S.cc+c.phone.slice(1):c.phone}','_blank')">💬</button><button class="d" onclick="if(confirm('حذف؟')){S.custs.splice(${i},1);save();render()}">✕</button></span></div>`}).join("")||'<p class="mu">العملاء يُحفظون تلقائيا عند البيع برقم هاتف.</p>'}</div>`}
/* ---------- reports ---------- */
function vRep(){const d0=new Date().setHours(0,0,0,0),td=S.sales.filter(s=>s.t>=d0),sum=a=>a.reduce((x,s)=>x+s.tot,0),top={};S.sales.forEach(s=>s.items.forEach(i=>top[i.n]=(top[i.n]||0)+i.q));
 $("#v").innerHTML=`<div class="grid"><div class="c"><div class="mu">مبيعات اليوم</div><div class="t">${fmt(sum(td))}</div><div class="mu">${td.length} فاتورة</div></div><div class="c"><div class="mu">الإجمالي الكلي</div><div class="t">${fmt(sum(S.sales))}</div><div class="mu">${S.sales.length} فاتورة</div></div></div>
 <div class="c"><b>الأكثر مبيعا</b>${Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n,q])=>`<div class="row"><span>${esc(n)}</span><b>${q}</b></div>`).join("")||'<p class="mu">لا بيانات</p>'}</div>
 <div class="c"><b>آخر الفواتير</b>${S.sales.slice(-30).reverse().map(s=>`<div class="row" onclick="showInv(${s.id})"><div>#${s.id} · ${esc(s.cust.name||"عميل")}<div class="mu">${new Date(s.t).toLocaleString("ar-EG")} · ${esc(s.by)}</div></div><b>${fmt(s.tot)}</b></div>`).join("")||'<p class="mu">لا مبيعات</p>'}</div>`}
/* ---------- AI ---------- */
function vAi(){$("#v").innerHTML=`<div class="c"><b>✨ مساعدك الذكي</b><p class="mu">اسأل عن مبيعاتك ومخزونك، مثل: ما الأصناف الراكدة؟ ماذا أطلب من الموردين؟</p><textarea id="aq" rows="3" placeholder="اكتب سؤالك"></textarea><button class="big" onclick="runAi()">اسأل</button><div class="ai" id="ao" hidden></div></div>`}
async function runAi(){const q=$("#aq").value.trim();if(!q)return;const o=$("#ao");o.hidden=false;o.textContent="⏳ جاري التحليل…";
 const top={};S.sales.forEach(s=>s.items.forEach(i=>top[i.n]=(top[i.n]||0)+i.q));
 const data={العملة:S.cur,عدد_الفواتير:S.sales.length,إجمالي_المبيعات:S.sales.reduce((a,s)=>a+s.tot,0),المبيعات_بالصنف:top,المخزون:S.prods.map(p=>({الاسم:p.name,الكمية:p.qty,السعر:p.price,التصنيف:p.cat})),آخر_فواتير:S.sales.slice(-20).map(s=>({وقت:new Date(s.t).toISOString().slice(0,10),إجمالي:s.tot}))};
 const t=await ask(`أنت مستشار لمتجر. أجب بالعربية بإيجاز وبنقاط عملية اعتمادا على البيانات فقط.\nالبيانات: ${JSON.stringify(data)}\nالسؤال: ${q}`);o.textContent=t||"تعذّر الاتصال بالذكاء الاصطناعي الآن."}
/* ---------- settings ---------- */
function vSet(){$("#v").innerHTML=`<div class="c"><b>الشركة</b><input id="sc" value="${esc(S.co)}" placeholder="الاسم"><div class="grid"><input id="sx" value="${esc(S.cur)}" placeholder="العملة"><input id="st" type="number" value="${S.tax}" placeholder="ضريبة %"></div><input id="sk" value="${esc(S.cc)}" placeholder="مفتاح الدولة (مصر 20)"><button class="big" onclick="saveSet()">حفظ</button></div>
 <div class="c"><b>المستخدمون</b>${S.users.map((u,i)=>`<div class="row"><span>${esc(u.name)} <span class="mu">${ROLES[u.role]}</span></span><span class="r"><button class="g" onclick="chPass(${i})">🔑</button>${u.role!=="owner"?`<button class="d" onclick="if(confirm('حذف؟')){S.users.splice(${i},1);save();render()}">✕</button>`:""}</span></div>`).join("")}
 <input id="nu" placeholder="اسم مستخدم جديد"><input id="nph" inputmode="tel" placeholder="رقم واتساب المستخدم"><input id="np" type="password" placeholder="كلمة السر"><select id="nr"><option value="manager">مدير</option><option value="cashier">كاشير</option></select><button class="big" onclick="addUser()">إضافة</button></div>
 <div class="c"><b>استرجاع كلمة سر صاحب الشركة</b><input id="op" inputmode="tel" placeholder="رقم واتساب صاحب الشركة" value="${esc(S.users.find(u=>u.role==="owner").phone||"01102200175")}"><button class="big" onclick="ownerRc()">حفظ الرقم وإنشاء كود جديد</button></div><div class="c"><b>نسخة احتياطية</b><div class="grid"><button class="g" onclick="backup()">تصدير</button><label class="btn g">استيراد<input type="file" accept=".json" hidden onchange="restore(this.files[0])"></label></div></div>`}
function saveSet(){S.co=$("#sc").value.trim()||S.co;S.cur=$("#sx").value.trim();S.tax=+$("#st").value||0;S.cc=$("#sk").value.replace(/\D/g,"")||"20";save();render()}
async function addUser(){const n=$("#nu").value.trim(),p=$("#np").value;if(!n||p.length<4)return alert("أكمل البيانات");if(S.users.some(u=>u.name===n))return alert("الاسم موجود");S.users.push({name:n,pass:await hash(p),role:$("#nr").value,phone:$("#nph").value.replace(/\D/g,"")});save();render()}
const np_=p=>{p=String(p||"").replace(/\D/g,"");return p.startsWith("0")?S.cc+p.slice(1):p};
const wl=(p,t)=>`https://wa.me/${np_(p)}?text=`+encodeURIComponent(t).replace(/'/g,"%27");
function genCode(){const a=new Uint32Array(2);crypto.getRandomValues(a);return(a[0].toString(36)+a[1].toString(36)).slice(0,8).toUpperCase()}
function showRc(code,phone){modal(`<div class="t">🔑 كود استرجاع كلمة السر</div><div class="c t" style="text-align:center;letter-spacing:3px">${code}</div><p class="mu">احتفظ به الآن، ولن يظهر مرة أخرى. به تغيّر كلمة سر صاحب الشركة لو نسيتها.</p><button class="big" onclick="window.open('${wl(phone,"كود استرجاع كلمة السر لـ "+S.co+": "+code)}','_blank')">💬 احفظه على واتساب</button><button class="g big" onclick="modal('')">تم، حفظته</button>`)}
function forgot(){modal(`<b>نسيت كلمة السر</b><input id="fu" placeholder="اسم المستخدم"><div class="c"><b>صاحب الشركة</b><p class="mu">أدخل كود الاسترجاع وكلمة سر جديدة.</p><input id="fc" placeholder="كود الاسترجاع"><input id="fp" type="password" placeholder="كلمة السر الجديدة"><button class="big" onclick="doReset()">تغيير كلمة السر</button></div><div class="c"><b>مدير أو كاشير</b><p class="mu">يُرسل طلب على واتساب لصاحب الشركة ليغيّرها لك.</p><button class="g big" onclick="askOwner()">إرسال طلب لصاحب الشركة</button></div><p class="mu" id="fe"></p><button class="d big" onclick="wipeAsk()">🗑️ نسيت الكود أيضا: مسح كل البيانات والبدء من جديد</button><button class="g big" onclick="modal('')">إغلاق</button>`)}
async function doReset(){const u=S.users.find(x=>x.name===$("#fu").value.trim()&&x.role==="owner"),c=$("#fc").value.trim().toUpperCase(),p=$("#fp").value;if(!u||p.length<4||!S.rc||await hash(c)!==S.rc){$("#fe").textContent="البيانات غير صحيحة";return}u.pass=await hash(p);const n=genCode();S.rc=await hash(n);save();showRc(n,u.phone)}
function wipeAsk(){modal(`<div class="t">⚠️ تأكيد المسح</div><p>سيتم حذف كل شيء نهائيا: المستخدمون، الأصناف، العملاء، والمبيعات. لا يمكن التراجع.</p><button class="d big" onclick="wipeNow()">نعم، امسح كل شيء</button><button class="g big" onclick="modal('')">إلغاء</button>`)}
function wipeNow(){try{localStorage.removeItem("pos2")}catch(e){}S=null;me=null;cart=[];modal("");render()}
function askOwner(){const n=$("#fu").value.trim(),o=S.users.find(u=>u.role==="owner");if(!n){$("#fe").textContent="اكتب اسم المستخدم أولا";return}window.open(wl(o.phone||"01102200175",`المستخدم ${n} نسي كلمة السر في ${S.co}. من فضلك غيّرها من الإعدادات.`),"_blank")}
function chPass(i){modal(`<b>كلمة سر جديدة لـ ${esc(S.users[i].name)}</b><input id="cpw" type="password" placeholder="كلمة السر الجديدة"><button class="big" onclick="setPass(${i})">حفظ</button><button class="g big" onclick="modal('')">إلغاء</button>`)}
async function setPass(i){const p=$("#cpw").value;if(p.length<4)return alert("4 أحرف على الأقل");const u=S.users[i];u.pass=await hash(p);save();modal(`<div class="t">✅ تم التغيير</div>${u.phone?`<button class="big" onclick="window.open('${wl(u.phone,"تم تغيير كلمة سرك في "+S.co+".\nاسم المستخدم: "+u.name+"\nكلمة السر الجديدة: "+p)}','_blank')">💬 إرسال لـ ${esc(u.name)} على واتساب</button>`:""}<button class="g big" onclick="modal('')">إغلاق</button>`)}
function ownerRc(){const o=S.users.find(u=>u.role==="owner"),p=$("#op").value.replace(/\D/g,"");if(p.length<8)return alert("رقم غير صحيح");o.phone=p;const c=genCode();hash(c).then(h=>{S.rc=h;save();showRc(c,p)})}
const _wo=window.open.bind(window);
window.open=function(u,t){let w=null;try{w=_wo(u,t)}catch(e){}
 if(!w&&/wa\.me/.test(u)){const m=decodeURIComponent((u.split("text=")[1]||"")),n=(u.match(/wa\.me\/(\d*)/)||[])[1]||"";window._m=m;
  modal(`<b>لم يُفتح واتساب تلقائيا</b><p class="mu">المتصفح منع الفتح من داخل هذه النافذة. اضغط أحد الأزرار، أو انسخ الرسالة وأرسلها بنفسك${n?" إلى "+n:""}.</p>${m?`<div class="c"><pre>${esc(m)}</pre></div>`:""}<a class="btn big" style="display:block;margin:6px 0" href="${u}" target="_blank" rel="noopener">فتح واتساب</a><a class="btn g" style="display:block;margin:6px 0" href="whatsapp://send?phone=${n}&text=${encodeURIComponent(m)}">فتح تطبيق واتساب مباشرة</a><button class="g big" onclick="navigator.clipboard.writeText(window._m).then(()=>alert('تم النسخ'),()=>alert('انسخ النص يدويا'))">نسخ الرسالة</button><button class="g big" onclick="modal('')">إغلاق</button>`)}
 return w};
async function backup(){try{const d=await claude.use("downloads");if(!d)throw 0;await d.save({filename:"pos-backup.json",data:JSON.stringify(S)})}catch(e){alert("التصدير غير متاح هنا")}}
function restore(f){if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.users||!d.prods)throw 0;S=d;save();me=null;render()}catch(e){alert("ملف غير صالح")}})}
render();
</script></body></html>
