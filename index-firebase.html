<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كاشير ذكي</title><meta name="theme-color" content="#0d9488"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="كاشير ذكي">
<style>
:root{--bg:#f3f5f7;--cd:#fff;--tx:#17202a;--mu:#6b7684;--pr:#0d9488;--pt:#fff;--bd:#e2e6ea;--rd:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101315;--cd:#1a1e21;--tx:#eef1f3;--mu:#98a2ad;--bd:#2b3136;--pr:#2dd4bf;--pt:#06201d;--rd:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.w{max-width:680px;margin:auto;padding:12px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
input,select,textarea{width:100%;padding:12px;margin:4px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button,.btn{display:inline-block;text-align:center;padding:12px 14px;border:0;border-radius:10px;background:var(--pr);color:var(--pt);font:inherit;font-weight:700;cursor:pointer}
button.g,.btn.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}button.d{background:var(--rd);color:#fff}button.big{width:100%;margin:6px 0;padding:15px}
.r{display:flex;gap:8px;align-items:center}.r>input,.r>select{flex:1}.r>button{flex:0 0 auto}
.nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto}
.nav button{flex:1 0 auto;background:none;color:var(--mu);font-size:12px;padding:6px 10px}.nav button.on{color:var(--pr)}.nav b{display:block;font-size:20px}
.mu{color:var(--mu);font-size:14px}.t{font-size:22px;font-weight:800}
.ai{background:color-mix(in srgb,var(--pr) 14%,transparent);border-radius:10px;padding:10px;margin:8px 0;font-size:15px;white-space:pre-wrap}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);gap:8px}
.ov{position:fixed;inset:0;background:#0009;z-index:9;display:flex;align-items:flex-end;justify-content:center}
.mc{background:var(--cd);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#rd{width:100%;min-height:200px;border-radius:10px;overflow:hidden;margin:8px 0;background:#000}
pre{white-space:pre-wrap;font:inherit;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media print{body>*:not(#md){display:none}.ov{position:static;background:none}.mc button,.mc .grid{display:none}.mc{max-height:none;overflow:visible}}
</style></head><body><div class="w" id="app"></div><div id="md"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ROLES={owner:"صاحب الشركة",manager:"مدير",cashier:"كاشير"};
let S=null,me=null,tab="pos",cart=[],disc=0,cust={name:"",phone:""},pm="نقدي",paid=0,found=null,scanner=null;
try{S=JSON.parse(localStorage.getItem("pos2")||"null")}catch(e){}

const fmt=n=>(+n||0).toFixed(2)+" "+S.cur;
async function hash(p){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("pos:"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return btoa(unescape(encodeURIComponent(p)))}}
function modal(h){$("#md").innerHTML=h?`<div class="ov"><div class="mc">${h}</div></div>`:""}
async function ask(p){try{const s=await claude.use("sample");if(!s)return null;return (await s(p,{modelTier:"quick"})).text}catch(e){return null}}
/* ---------- shell ---------- */
function render(){
 if(!S&&!SR){$("#app").innerHTML='<div class="c">⏳ جاري الاتصال بقاعدة البيانات…</div>';return}
 if(!S&&!NEWCO){gate();return}
 const a=$("#app");
 if(!S){a.innerHTML=`<div class="c"><div class="t">🛒 إنشاء الشركة</div><p class="mu">أول حساب هو صاحب الشركة.</p><input id="co" placeholder="اسم الشركة"><input id="cu" placeholder="العملة (مثال: ج.م)" value="ج.م"><input id="u" placeholder="اسم المستخدم"><input id="ph" inputmode="tel" value="" placeholder="رقم واتساب صاحب الشركة"><input id="p" type="password" placeholder="كلمة السر (4 أحرف+)"><button class="big" onclick="setup()">إنشاء</button></div>`;$(".nav")?.remove();return}
 if(!me){a.innerHTML=`<div class="c"><div class="t">${esc(S.co)}</div><p class="mu">تسجيل الدخول</p><input id="u" placeholder="اسم المستخدم"><input id="p" type="password" placeholder="كلمة السر" onkeydown="if(event.key==='Enter')login()"><button class="big" onclick="login()">دخول</button><button class="g big" onclick="forgot()">نسيت كلمة السر؟</button><p id="er" class="mu"></p></div>`;$(".nav")?.remove();return}
 const T=[can("pos")&&["pos","🧾","بيع"],can("prod")&&["prod","📦","الأصناف"],can("stk")&&["stk","📋","الجرد"],can("sup")&&["sup","🚚","الموردين"],can("cust")&&["cust","👥","العملاء"],can("rep")&&["rep","📊","التقارير"],can("log")&&["log","🕘","النشاط"],can("ai")&&["ai","✨","الذكاء"],isO()&&["set","⚙️","الإعدادات"]].filter(Boolean);
 if(!T.some(t=>t[0]===tab))tab=T[0][0];
 a.innerHTML=`<div class="r" style="margin-bottom:10px;justify-content:space-between"><div><b>${esc(S.co)}</b><div class="mu">${esc(me.name)} · ${ROLES[me.role]}</div></div><button class="g" onclick="me=null;cart=[];render()">خروج</button></div>${hdrX()}<div id="v"></div>`;
 $(".nav")?.remove();document.body.insertAdjacentHTML("beforeend",`<div class="nav">${T.map(([k,i,l])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';render()"><b>${i}</b>${l}</button>`).join("")}</div>`);
 ({pos:vPos,prod:vProd,cust:vCust,rep:vRep,ai:vAi,set:vSet,sup:vSup,stk:vStk,log:vLog})[tab]();}
async function setup(){const co=$("#co").value.trim(),u=$("#u").value.trim(),p=$("#p").value,ph0=$("#ph").value.replace(/\D/g,""),code=genCode();if(!co||!u||p.length<4||ph0.length<8)return alert("أكمل الحقول مع رقم الواتساب");
 S={co,cur:$("#cu").value.trim()||"",tax:0,cc:"20",users:[{name:u,pass:await hash(p),role:"owner",phone:ph0}],rc:await hash(code),cats:["عام"],prods:[],custs:[],sales:[]};fixS();save();render();showRc(code,ph0)}
async function login(){const u=$("#u").value.trim(),h=await hash($("#p").value);const x=S.users.find(x=>x.name===u&&x.pass===h);if(!x){$("#er").textContent="بيانات غير صحيحة";return}me=x;tab="pos";render()}
/* ---------- scanner ---------- */
async function scan(cb){
 modal(`<b>وجّه الكاميرا نحو الباركود أو كود QR</b><div id="rd"></div><p class="mu" id="se"></p><label class="btn g" style="display:block;margin-bottom:8px">📷 التقاط صورة للباركود<input type="file" accept="image/*" capture="environment" hidden id="sf"></label><button class="g big" onclick="endScan()">إغلاق</button>`);
 $("#sf").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const s=scanner||new Html5Qrcode("rd");const r=await s.scanFile(f,false);await endScan();cb(r)}catch(x){$("#se").textContent="لم أتعرف على الباركود، جرّب صورة أوضح."}};
 try{let dn=0;scanner=new Html5Qrcode("rd");await scanner.start({facingMode:"environment"},{fps:10,qrbox:w=>{const m=Math.floor(Math.min(w,320)*.8);return{width:m,height:m}}},async t=>{if(dn)return;dn=1;await endScan();cb(t)},()=>{})}
 catch(e){$("#se").textContent="الكاميرا غير متاحة داخل هذه النافذة. افتح الرابط في المتصفح مباشرة، أو استخدم زر التقاط صورة."}}
async function endScan(){try{if(scanner){await scanner.stop();scanner.clear()}}catch(e){}scanner=null;modal("")}
/* ---------- cashier ---------- */
function vPos(){$("#v").innerHTML=`<div class="c"><div class="r"><input id="bc" placeholder="باركود / اسم الصنف (أو جهاز قارئ)" onkeydown="if(event.key==='Enter')look(this.value)"><button onclick="look($('#bc').value)">بحث</button></div><button class="big" onclick="scan(look)">📷 مسح بالكاميرا</button><div id="fd"></div></div>
<div class="c"><b>السلة</b><div id="ct"></div></div>
<div class="c"><b>العميل</b><input id="cp" inputmode="tel" placeholder="رقم الهاتف" value="${esc(cust.phone)}" oninput="cust.phone=this.value;autoC()"><input id="cn" placeholder="اسم العميل" value="${esc(cust.name)}" oninput="cust.name=this.value"></div>
<div class="c"><div class="grid"><input id="ds" type="number" min="0" placeholder="خصم" value="${disc||""}" oninput="disc=+this.value||0;totals()"><select onchange="pm=this.value;totals()">${["نقدي","بطاقة","تحويل","آجل"].map(x=>`<option ${x===pm?"selected":""}>${x}</option>`).join("")}</select></div><div id="tt"></div></div>`;showF();showC()}
function autoC(){const p=cust.phone.replace(/\D/g,"");const c=S.custs.find(x=>x.phone===p);if(c&&p.length>5){cust.name=c.name;$("#cn").value=c.name}}
function look(q){q=String(q||"").trim();if(!q)return;const iv=q.match(/^INV\|(\d+)\|/);if(iv&&sale(+iv[1])){$("#bc")&&($("#bc").value="");return showInv(+iv[1])}const p=S.prods.find(x=>x.bc===q)||S.prods.find(x=>x.name.includes(q));found=p||{none:q};showF();if(p)explain(p);$("#bc")&&($("#bc").value="")}
function showF(){const f=$("#fd");if(!f)return;if(!found){f.innerHTML="";return}
 if(found.none){f.innerHTML=`<p class="mu">لا يوجد صنف: ${esc(found.none)}</p>${can("prod")?`<button class="g" onclick="editProd(-1,'${esc(found.none)}')">➕ إضافة صنف بهذا الباركود</button>`:""}`;return}
 f.innerHTML=`<div class="row"><div><b>${esc(found.name)}</b><div class="mu">${esc(found.cat)} · متاح ${found.qty}</div></div><b>${fmt(found.price)}</b></div><div class="ai" id="ai">${found.desc?"✨ "+esc(found.desc):"⏳ الذكاء الاصطناعي يشرح الصنف…"}</div><button class="big" onclick="add(S.prods.indexOf(found))">➕ أضف إلى السلة</button>`}
async function explain(p){if(p.desc)return;const t=await ask(`اشرح بالعربية البسيطة في جملتين فقط: ما استخدام هذا المنتج ولمن يناسب وأي تنبيه مهم؟ المنتج: ${p.name} (التصنيف: ${p.cat}). بدون مقدمات.`);if(t){p.desc=t.trim();save()}else if(found===p){$("#ai").textContent="تعذّر الشرح الآن.";return}if(found===p)showF()}
function add(i){const p=S.prods[i];if(!p)return;const x=cart.find(c=>c.i===i);const q=x?x.q:0;if(q>=p.qty)return alert("نفد المخزون");x?x.q++:cart.push({i,q:1});showC()}
function qty(i,d){const x=cart.find(c=>c.i===i);x.q=Math.min(x.q+d,S.prods[i].qty);if(x.q<=0)cart=cart.filter(c=>c!==x);showC()}
function calc(){const sub=cart.reduce((a,c)=>a+S.prods[c.i].price*c.q,0),d=Math.min(disc,sub),tax=(sub-d)*S.tax/100;return{sub,d,tax,tot:sub-d+tax}}
function showC(){const c=$("#ct");if(!c)return;c.innerHTML=cart.map(x=>{const p=S.prods[x.i];return`<div class="row"><span style="flex:1">${esc(p.name)}<div class="mu">${fmt(p.price)}</div></span><span class="r"><button class="g" onclick="qty(${x.i},-1)">−</button><b>${x.q}</b><button class="g" onclick="qty(${x.i},1)">+</button></span></div>`}).join("")||`<p class="mu">السلة فارغة</p>`;totals()}
function totals(){const t=$("#tt");if(!t)return;const k=calc();t.innerHTML=cart.length?`<div class="row"><span>المجموع</span><span>${fmt(k.sub)}</span></div>${S.tax?`<div class="row"><span>ضريبة ${S.tax}%</span><span>${fmt(k.tax)}</span></div>`:""}<div class="row t"><span>الإجمالي</span><span>${fmt(k.tot)}</span></div>${pm==="آجل"?`<input id="pd0" type="number" step="any" inputmode="decimal" placeholder="المدفوع الآن (اختياري)" value="${paid||""}" oninput="paid=+this.value||0"><div class="mu">الباقي يتسجل آجل على العميل. لازم رقم هاتفه.</div>`:""}<button class="big" onclick="checkout()">✅ إتمام البيع</button>`:""}
function checkout(){const k=calc(),cr=pm==="آجل",pdn=cr?Math.min(Math.max(paid,0),k.tot):k.tot;if(cr&&cust.phone.replace(/\D/g,"").length<8)return alert("البيع الآجل محتاج رقم هاتف العميل");const items=cart.map(x=>{const p=S.prods[x.i];p.qty-=x.q;return{n:p.name,q:x.q,pr:p.price,co:p.cost||0}});const ph=cust.phone.replace(/\D/g,"");
 if(ph){let c=S.custs.find(x=>x.phone===ph);c?(c.name=cust.name||c.name):S.custs.push(c={phone:ph,name:cust.name});if(cr)c.bal=+((c.bal||0)+(k.tot-pdn)).toFixed(2)}
 const s={id:nextId(),br:CB,fx:fxInfo(k.tot),uid:genCode(),t:Date.now(),by:me.name,cust:{name:cust.name,phone:ph},items,sub:k.sub,disc:k.d,tax:k.tax,tot:k.tot,pay:pm,paid:pdn,due:+(k.tot-pdn).toFixed(2)};S.sales.push(s);save();cart=[];found=null;disc=0;paid=0;pm="نقدي";cust={name:"",phone:""};render();showInv(s.id)}
/* ---------- invoice ---------- */
const sale=id=>S.sales.find(s=>s.id===id);
const ICSS=".inv{background:#fff;color:#111;border:1px solid #ddd;border-radius:12px;padding:14px;margin-bottom:6px;font-family:system-ui,Tahoma,sans-serif}.inv table{width:100%;border-collapse:collapse;font-size:14px}.inv th,.inv td{padding:6px 4px;border-bottom:1px solid #e5e5e5;text-align:start}.inv .tt{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}.inv .gt{font-weight:800;font-size:17px;border-top:2px solid #111;margin-top:4px;padding-top:6px}.inv .qr{text-align:center;margin:12px 0 2px}.inv .qr img{width:150px;height:150px;image-rendering:pixelated}";
document.head.insertAdjacentHTML("beforeend","<style>"+ICSS+"</style>");
function payCust(i){const c=S.custs[i];modal(`<b>تسجيل دفعة من ${esc(c.name||c.phone)}</b><p class="mu">المتبقي عليه: ${fmt(c.bal)}</p><input id="pa" type="number" step="any" inputmode="decimal" placeholder="المبلغ المدفوع"><button class="big" onclick="doPay(${i})">تسجيل الدفعة</button><button class="g big" onclick="modal('')">إلغاء</button>`)}
function doPay(i){const c=S.custs[i],a=+$("#pa").value;if(!(a>0))return alert("اكتب مبلغا صحيحا");if(a>c.bal+0.001)return alert("المبلغ أكبر من المديونية");c.bal=Math.max(0,+(c.bal-a).toFixed(2));(S.pays=S.pays||[]).push({t:Date.now(),phone:c.phone,amt:a,by:me.name});save();modal("");render()}
function qrUrl(s){try{try{qrcode.stringToBytes=qrcode.stringToBytesFuncs["UTF-8"]}catch(e){}const q=qrcode(0,"M");q.addData(`INV|${s.id}|${new Date(s.t).toISOString()}|${(+s.tot).toFixed(2)}|${(+s.tax).toFixed(2)}|${s.uid||""}`);q.make();return q.createDataURL(5,2)}catch(e){return""}}
function invHtml(s){const r=s.items.map(i=>`<tr><td>${esc(i.n)}</td><td>${i.q}</td><td>${(+i.pr).toFixed(2)}</td><td>${(i.pr*i.q).toFixed(2)}</td></tr>`).join(""),u=qrUrl(s);
 return `<div class="inv"><div style="text-align:center"><b style="font-size:20px">${esc(S.co)}</b><div>فاتورة إلكترونية</div></div><div style="margin:10px 0;font-size:14px;line-height:1.7">رقم الفاتورة: <b>${s.id}</b><br>التاريخ: ${new Date(s.t).toLocaleString("ar-EG")}<br>${s.cust.name?"العميل: "+esc(s.cust.name)+"<br>":""}${s.cust.phone?"الهاتف: "+esc(s.cust.phone)+"<br>":""}الكاشير: ${esc(s.by)}</div><table><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${r}</table><div style="margin-top:8px"><div class="tt"><span>المجموع</span><span>${fmt(s.sub)}</span></div>${s.disc?`<div class="tt"><span>الخصم</span><span>${fmt(s.disc)}</span></div>`:""}${s.tax?`<div class="tt"><span>الضريبة</span><span>${fmt(s.tax)}</span></div>`:""}<div class="tt gt"><span>الإجمالي</span><span>${fmt(s.tot)}</span></div><div class="tt"><span>طريقة الدفع</span><span>${esc(s.pay)}</span></div>${s.due>0?`<div class="tt"><span>المدفوع</span><span>${fmt(s.paid)}</span></div><div class="tt" style="font-weight:800"><span>المتبقي (آجل)</span><span>${fmt(s.due)}</span></div>`:""}</div>${u?`<div class="qr"><img alt="QR" src="${u}"></div><div style="text-align:center;font-size:12px;color:#555">امسح الكود للتحقق من الفاتورة</div>`:""}<div style="text-align:center;margin-top:8px;font-size:13px">شكرا لتعاملكم معنا 🙏</div></div>`}
function invDoc(s){return `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاتورة ${s.id}</title><style>body{margin:0;padding:12px;background:#f3f5f7}.inv{max-width:480px;margin:auto}${ICSS}</style></head><body>${invHtml(s)}</body></html>`}
async function dlInv(id){const s=sale(id);try{const d=await claude.use("downloads");if(!d)throw 0;await d.save({filename:"invoice-"+s.id+".html",data:invDoc(s)})}catch(e){alert("التحميل غير متاح هنا. استخدم زر الطباعة ثم احفظ كـ PDF")}}
function scanFor(i){const d={bc:"",name:$("#pn").value,price:$("#pp").value,cost:$("#pcost").value,qty:$("#pq").value,cat:$("#pc").value,desc:$("#pd").value,sup:$("#psup").value};scan(t=>editProd(i,"",{...d,bc:t}))}
function invTxt(s){return `*${S.co}*\nفاتورة رقم ${s.id}\n${new Date(s.t).toLocaleString("ar-EG")}\n${s.cust.name?"العميل: "+s.cust.name+"\n":""}----------\n`+s.items.map(i=>`${i.n} × ${i.q} = ${fmt(i.pr*i.q)}`).join("\n")+`\n----------\nالمجموع: ${fmt(s.sub)}\n`+(s.disc?`الخصم: ${fmt(s.disc)}\n`:"")+(s.tax?`الضريبة: ${fmt(s.tax)}\n`:"")+`*الإجمالي: ${fmt(s.tot)}*\nالدفع: ${s.pay}${s.due>0?`\nالمدفوع: ${fmt(s.paid)}\nالمتبقي: ${fmt(s.due)}`:""}\nشكرا لتعاملكم معنا 🙏`}
function showInv(id){const s=sale(id);modal(`${invHtml(s)}<div class="grid" style="margin-top:10px"><button style="grid-column:1/-1" onclick="dlInv(${id})">⬇️ تحميل الفاتورة</button><button onclick="sendWa(${id})">واتساب</button><button onclick="sendSms(${id})">رسالة SMS</button><button class="g" onclick="shareInv(${id})">مشاركة</button><button class="g" onclick="navigator.clipboard.writeText(invTxt(sale(${id}))).then(()=>alert('تم النسخ'),()=>alert('تعذّر النسخ'))">نسخ</button><button class="g" onclick="window.print()">طباعة / PDF</button><button class="g" onclick="dlEinv(${id})">JSON إلكتروني</button><button class="g" onclick="modal('')">إغلاق</button></div>`)}
function ph(s){let p=s.cust.phone;if(p.startsWith("0"))p=S.cc+p.slice(1);return p}
function sendWa(id){const s=sale(id);window.open(`https://wa.me/${s.cust.phone?ph(s):""}?text=${encodeURIComponent(invTxt(s))}`,"_blank")}
function sendSms(id){const s=sale(id);location.href=`sms:${s.cust.phone}?body=${encodeURIComponent(invTxt(s).replace(/\*/g,""))}`}
async function shareInv(id){try{await navigator.share({text:invTxt(sale(id)).replace(/\*/g,"")})}catch(e){}}

/* --- hash (SHA-256 يعمل حتى بدون HTTPS) + توافق مع الهاش القديم --- */
function sha256(m){const K=[],H=[],r=(x,y)=>x>>>y|x<<32-y;for(let p=2,n=0;n<64;p++){let c=1;for(let i=2;i*i<=p;i++)if(p%i==0){c=0;break}if(c){if(n<8)H[n]=Math.pow(p,.5)*4294967296|0;K[n++]=Math.pow(p,1/3)*4294967296|0}}
 const b=[...new TextEncoder().encode(m)],l=b.length*8;b.push(128);while(b.length%64!=56)b.push(0);b.push(0,0,0,0,l>>>24&255,l>>>16&255,l>>>8&255,l&255);
 for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=b[o+i*4]<<24|b[o+i*4+1]<<16|b[o+i*4+2]<<8|b[o+i*4+3];for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=w[i-16]+(r(a,7)^r(a,18)^a>>>3)+w[i-7]+(r(c,17)^r(c,19)^c>>>10)|0}
 let v=H.slice();for(let i=0;i<64;i++){const[a,b2,c,d,e,f,g,h]=v,t1=h+(r(e,6)^r(e,11)^r(e,25))+(e&f^~e&g)+K[i]+w[i]|0,t2=(r(a,2)^r(a,13)^r(a,22))+(a&b2^a&c^b2&c)|0;v=[t1+t2|0,a,b2,c,d+t1|0,e,f,g]}for(let i=0;i<8;i++)H[i]=H[i]+v[i]|0}
 return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")}
async function hash(p){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("pos:"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return sha256("pos:"+p)}}
